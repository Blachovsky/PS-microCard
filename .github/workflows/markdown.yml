name: Check Markdown links

on:
  push:
    branches:
      - main

  pull_request:

  workflow_dispatch:

jobs:
  link-check:
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Check Markdown links
        uses: lycheeverse/lychee-action@v2.9.0
        with:
          args: >-
            --root-dir "${{ github.workspace }}"
            --verbose
            --no-progress
            --exclude '^https://github\.com/user-attachments/assets/f54d0bfc-f955-47ab-805d-b30cb20fdbb1$'
            --exclude '^https://fsf\.org/$'
            './**/*.md'
          fail: true
